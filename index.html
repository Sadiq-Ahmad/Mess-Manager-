<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mess Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c101b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  box-sizing:border-box;
  --bg:#0c101b;--bg2:#121829;--card:#161d31;--card2:#1b2440;--line:#27314e;
  --ink:#f3efe4;--mut:#9aa4bb;
  --gold:#e3b04b;--gold2:#b98a2c;--blue:#2f7bff;--blue2:#1c5fe0;
  --good:#3fd18b;--bad:#ff6b5e;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);
  background:radial-gradient(1200px 500px at 50% -10%,#1a2442 0%,var(--bg) 60%) fixed;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}

/* header */
header{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(180deg,rgba(12,16,27,.98),rgba(12,16,27,.88));backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.hwrap{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:13px;flex:0 0 auto;box-shadow:0 0 0 1.5px var(--gold2),0 4px 14px rgba(0,0,0,.5)}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:19px;letter-spacing:.3px;line-height:1.15}
.ttl h1 b{color:var(--gold)}
.sig{font:italic 13px/1.2 "Segoe Script","Brush Script MT","Lucida Handwriting",cursive,serif;color:var(--gold);opacity:.95;margin-top:3px}
.dt{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.dt i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px}

main{max-width:640px;margin:0 auto;padding:12px 14px calc(100px + env(safe-area-inset-bottom,0px))}

/* cards */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card h2{font-size:13px;margin:0 0 12px;color:var(--gold);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--ink);background:#0e1424;border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:48px}
input::placeholder{color:#5f6a85}
input:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,176,75,.18)}
input[type=date]{color-scheme:dark}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1;min-width:0}

/* buttons */
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 14px;background:var(--card2);color:var(--ink);transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button.primary{width:100%;margin-top:16px;border:0;font-weight:700;font-size:16px;color:#1b1405;
  background:linear-gradient(180deg,#f3cb6a,var(--gold) 55%,var(--gold2));box-shadow:0 6px 16px rgba(227,176,75,.25)}
button.blue{border:0;color:#fff;font-weight:600;background:linear-gradient(180deg,#4d92ff,var(--blue2))}
button.small{min-height:38px;padding:7px 13px;font-size:14px;border-radius:10px}
button.danger{color:var(--bad);background:transparent;border-color:#4a2a2f}
button.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:0 0 auto}
.chips button.on{background:linear-gradient(180deg,#4d92ff,var(--blue2));border-color:transparent;color:#fff;font-weight:600}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.meals button{min-height:52px;font-weight:600}
.meals button.on{background:linear-gradient(180deg,#f3cb6a,var(--gold2));color:#1b1405;border-color:transparent}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.people button{display:flex;align-items:center;gap:9px;min-height:54px;text-align:left;border-radius:14px}
.people button.on{border-color:var(--good);background:rgba(63,209,139,.12)}
.people button .tick{margin-left:auto;color:var(--good);font-weight:800}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#1b1405;
  background:linear-gradient(180deg,#f3cb6a,var(--gold2))}
.av.sm{width:30px;height:30px;font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat span{display:block;font-size:12px;color:var(--mut)}
.stat b{display:block;font-size:16px;margin-top:3px;color:var(--ink)}
.hero{border-radius:20px;padding:18px;margin:12px 0;color:#1b1405;
  background:linear-gradient(135deg,#f6d27a,var(--gold) 50%,var(--gold2));box-shadow:0 10px 26px rgba(227,176,75,.22)}
.hero small{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.75}
.hero .big{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0 10px}
.hero .mini{display:flex;gap:16px;font-size:13px;font-weight:600}
.hero .mini div span{display:block;font-size:11px;opacity:.7;font-weight:600}

/* list items */
.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .l{min-width:0;flex:1}
.item .l div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .l div+div{font-size:13px;color:var(--mut)}
.amt{font-weight:800;color:var(--gold);white-space:nowrap}
.good{color:var(--good)}.bad{color:var(--bad)}
.pc{padding:12px 0;border-top:1px solid var(--line)}
.pc:first-of-type{border-top:0}
.pc .top{display:flex;align-items:center;gap:10px}
.pc .top b{flex:1}
.badge{font-weight:800;font-size:14px;padding:5px 11px;border-radius:999px}
.badge.get{color:var(--good);background:rgba(63,209,139,.13)}
.badge.give{color:var(--bad);background:rgba(255,107,94,.13)}
.badge.eq{color:var(--mut);background:var(--card2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.trio div{background:#0e1424;border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;color:var(--mut)}
.trio div b{display:block;color:var(--ink);font-size:14px;margin-top:1px}
.settle{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.settle:first-of-type{border-top:0}
.settle .arrow{color:var(--gold)}
.toast{position:sticky;top:76px;z-index:4;background:#2a2412;border:1px solid var(--gold2);color:#f6dca0;padding:11px 13px;border-radius:12px;margin:10px 0;font-size:14px}
.toast.warn{background:#3a1d1f;border-color:#7a3a3f;color:#ffc9c4}
.sum{font-size:14px;color:var(--mut)}
.sum b{color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
a.btnlink{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:600;min-height:38px;border-radius:10px;background:linear-gradient(180deg,#34c76f,#1e9a50);font-size:14px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:6;background:rgba(18,24,41,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.navin{display:flex;width:100%;max-width:640px;gap:4px}
nav button{flex:1;background:transparent;border:0;border-radius:14px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:12px;padding:6px 2px}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold);background:rgba(227,176,75,.1);font-weight:700}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 4px}
.foot b{color:var(--gold)}
</style>
</head>

<script>
const KEY = "mess_manager_v1";
const MEALS = ["Subah", "Dopahar", "Raat"];
const QUICK = ["Sabzi", "Gosht", "Raashan", "Doodh", "Roti", "Gas", "Phal", "Doosra"];
let storageOK = true, deferredInstall = null;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.members)) return s;
  } catch (e) { storageOK = false; }
  return { members: [], expenses: [], att: {}, nid: 1 };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } }

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const rs = n => "Rs " + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nameOf = id => (S.members.find(m => m.id === id) || { name: "?" }).name;
const av = (id, cls = "") => `<div class="av ${cls}">${esc(nameOf(id).trim().charAt(0).toUpperCase() || "?")}</div>`;
const activeMembers = () => S.members.filter(m => m.active);
const inR = (x, a, b) => x >= a && x <= b;
// kya yeh banda us tareekh ko mess mein tha? (Band hone ki tareekh se pehle tak hi gina jata hai)
const here = (id, d) => { const m = S.members.find(x => x.id === id); return !!m && (m.active || (!!m.left && d < m.left)); };
const memWarn = id => {
  const n = S.expenses.filter(x => x.mid === id).length;
  const h = Object.values(S.att).filter(ids => ids.includes(id)).length;
  return n + h === 0 ? "Is ka koi record nahi, seedha delete ho jaye ga. Dobara dabayen."
    : `Is ke ${n} kharchay aur ${h} hazriyan bhi delete ho jayen gi aur hisab badal jaye ga. Behtar hai "Band" karein. Phir bhi delete karna hai to dobara dabayen.`;
};
const niceDate = s => { const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };

function range(kind) {
  const t = today(), d = new Date(t + "T00:00:00");
  if (kind === "today") return [t, t];
  if (kind === "week") { const a = addDays(t, -((d.getDay() + 6) % 7)); return [a, addDays(a, 6)]; }
  if (kind === "month") return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  return [iso(new Date(d.getFullYear(), d.getMonth() - 1, 1)), iso(new Date(d.getFullYear(), d.getMonth(), 0))];
}

/* ---------- hisab kitab ---------- */
const totalExp = (a, b) => S.expenses.filter(e => inR(e.date, a, b)).reduce((s, e) => s + e.amount, 0);

function calc(a, b) {
  const paid = {}, meals = {};
  S.expenses.forEach(e => { if (inR(e.date, a, b)) paid[e.mid] = (paid[e.mid] || 0) + e.amount; });
  Object.entries(S.att).forEach(([k, ids]) => {
    const d = k.split("|")[0];
    if (inR(d, a, b)) ids.forEach(i => { if (here(i, d)) meals[i] = (meals[i] || 0) + 1; });
  });
  const total = Object.values(paid).reduce((s, x) => s + x, 0);
  const tm = Object.values(meals).reduce((s, x) => s + x, 0);
  const rate = tm ? total / tm : 0;
  const ids = [...new Set([...Object.keys(paid), ...Object.keys(meals)].map(Number))];
  const rows = ids.map(id => {
    const p = paid[id] || 0, m = meals[id] || 0, share = m * rate;
    return { id, name: nameOf(id), paid: p, meals: m, share, bal: p - share };
  }).sort((x, y) => x.name.localeCompare(y.name));
  return { rows, total, tm, rate };
}

function settle(rows) {
  const dr = rows.filter(r => r.bal < -0.5).map(r => ({ n: r.name, id: r.id, v: -r.bal })).sort((x, y) => y.v - x.v);
  const cr = rows.filter(r => r.bal > 0.5).map(r => ({ n: r.name, id: r.id, v: r.bal })).sort((x, y) => y.v - x.v);
  const out = []; let i = 0, j = 0;
  while (i < dr.length && j < cr.length) {
    const amt = Math.min(dr[i].v, cr[j].v);
    out.push({ from: dr[i].n, fid: dr[i].id, to: cr[j].n, tid: cr[j].id, amt });
    dr[i].v -= amt; cr[j].v -= amt;
    if (dr[i].v < 0.5) i++;
    if (cr[j].v < 0.5) j++;
  }
  return out;
}

function daily(a, b) {
  const m = {};
  S.expenses.forEach(e => { if (inR(e.date, a, b)) { m[e.date] = m[e.date] || { amt: 0, meals: 0 }; m[e.date].amt += e.amount; } });
  Object.entries(S.att).forEach(([k, ids]) => { const d = k.split("|")[0]; if (m[d]) m[d].meals += ids.filter(i => here(i, d)).length; });
  return Object.entries(m).sort((x, y) => y[0].localeCompare(x[0]));
}

function reportText() {
  const a = ui.from, b = ui.to, r = calc(a, b);
  let t = `*Mess Hisab* - Sadiq Ahmad\n${a} se ${b}\nTotal kharcha: ${rs(r.total)}\nTotal khane: ${r.tm}\nEk khane ka rate: ${rs(r.rate)}\n\n`;
  r.rows.forEach(x => {
    t += `${x.name}: lagaye ${rs(x.paid)}, khane ${x.meals}, hissa ${rs(x.share)}, ` +
      (x.bal > 0.5 ? "lene " + rs(x.bal) : x.bal < -0.5 ? "dene " + rs(-x.bal) : "barabar") + "\n";
  });
  const s = settle(r.rows);
  if (s.length) { t += "\n*Kis ne kis ko dena hai*\n"; s.forEach(x => t += `${x.from} -> ${x.to}: ${rs(x.amt)}\n`); }
  return t;
}

/* ---------- UI state ---------- */
const ui = {
  tab: "exp", msg: "", warn: false, pendingDel: null, pendingMem: null,
  expDate: today(), payer: "", item: "", amount: "",
  attDate: today(), meal: "Raat", checked: new Set(), attSaved: false,
  from: "", to: "", rk: "month"
};
[ui.from, ui.to] = range("month");

function migrate() {
  if (!S.att) S.att = {};
  S.members.forEach(m => { if (!m.active && !m.left) m.left = today(); });
}
function loadAtt() {
  const saved = S.att[ui.attDate + "|" + ui.meal];
  ui.attSaved = !!saved;
  const act = new Set(activeMembers().map(m => m.id));
  ui.checked = new Set(saved ? saved.filter(i => act.has(i)) : act);
}
migrate(); save(); loadAtt();

const ICONS = {
  exp: '<svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l12-3v3"/><circle cx="16.5" cy="14" r="1.2"/></svg>',
  att: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  rep: '<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  mem: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 1.8 4.5 4.5"/></svg>'
};
const TABS = [["exp", "Kharcha"], ["att", "Hazri"], ["rep", "Hisab"], ["mem", "Members"]];
const NOMEM = `<div class="card"><div class="empty">Pehle neeche <b>Members</b> tab mein saray log add karein.</div></div>`;

/* ---------- views ---------- */
function viewExp() {
  const am = activeMembers();
  if (!am.length) return NOMEM;
  if (!am.find(m => String(m.id) === String(ui.payer))) ui.payer = am[0].id;
  const t = today(), [m1, m2] = range("month");
  const list = [...S.expenses].sort((x, y) => y.date.localeCompare(x.date) || y.id - x.id).slice(0, 100);
  return `
  <div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat"><span>Aaj ka kharcha</span><b>${rs(totalExp(t, t))}</b></div>
    <div class="stat"><span>Is mahine ka</span><b>${rs(totalExp(m1, m2))}</b></div>
  </div>
  <div class="card"><h2>Naya kharcha likhein</h2>
    <label>Kya liya?</label>
    <div class="chips">${QUICK.map(q => `<button class="small ${ui.item === q ? "on" : ""}" data-act="qi" data-v="${q}">${q}</button>`).join("")}</div>
    <input type="text" style="margin-top:10px" data-bind="item" value="${esc(ui.item)}" placeholder="Ya khud likhein...">
    <div class="row">
      <div><label>Paisa (Rs)</label><input type="number" inputmode="decimal" min="0" data-bind="amount" value="${esc(ui.amount)}" placeholder="0"></div>
      <div><label>Tareekh</label><input type="date" data-bind="expDate" value="${ui.expDate}"></div>
    </div>
    <label>Kis ne sauda lia?</label>
    <select data-bind="payer">${am.map(m => `<option value="${m.id}" ${String(m.id) === String(ui.payer) ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
    <button class="primary" data-act="addExp">Kharcha Save Karo</button>
  </div>
  <div class="card"><h2>Pichle kharchay</h2>
    ${list.length ? list.map(e => `
      <div class="item">${av(e.mid)}
        <div class="l"><div>${esc(e.item || "Sauda")}</div><div>${esc(nameOf(e.mid))} · ${niceDate(e.date)}</div></div>
        <div class="amt">${rs(e.amount)}</div>
        <button class="small ${ui.pendingDel === e.id ? "confirm" : "danger"}" data-act="delExp" data-id="${e.id}">${ui.pendingDel === e.id ? "Pakka?" : "✕"}</button>
      </div>`).join("") : `<div class="empty">Abhi koi kharcha nahi likha.</div>`}
  </div>`;
}

function viewAtt() {
  const am = activeMembers();
  if (!am.length) return NOMEM;
  const hist = Object.entries(S.att).map(([k, ids]) => { const [d, m] = k.split("|"); return { d, m, ids: ids.filter(i => here(i, d)) }; })
    .sort((x, y) => y.d.localeCompare(x.d) || MEALS.indexOf(y.m) - MEALS.indexOf(x.m)).slice(0, 30);
  return `
  <div class="card"><h2>Kis din, kon sa khana?</h2>
    <div class="row">
      <button style="flex:0 0 56px" data-act="prevDay">‹</button>
      <input type="date" data-bind="attDate" value="${ui.attDate}">
      <button style="flex:0 0 56px" data-act="nextDay">›</button>
    </div>
    <div class="meals">${MEALS.map(m => `<button class="${ui.meal === m ? "on" : ""}" data-act="meal" data-m="${m}">${m}</button>`).join("")}</div>
  </div>
  <div class="card"><h2>Kon kha raha hai? (${ui.checked.size} log)</h2>
    <div class="people">
      ${am.map(m => `<button class="${ui.checked.has(m.id) ? "on" : ""}" data-act="tog" data-id="${m.id}">${av(m.id, "sm")}<span>${esc(m.name)}</span>${ui.checked.has(m.id) ? '<span class="tick">✓</span>' : ""}</button>`).join("")}
    </div>
    <div class="row" style="margin-top:12px">
      <button class="small" data-act="allOn">Sab tick</button>
      <button class="small" data-act="allOff">Sab saaf</button>
    </div>
    <div class="sum" style="margin-top:12px">${ui.attSaved ? "✅ Yeh hazri save ho chuki hai." : "⚠️ Yeh hazri abhi save nahi hui."}</div>
    <button class="primary" data-act="saveAtt">Hazri Save Karo</button>
  </div>
  <div class="card"><h2>Pichli hazriyan</h2>
    ${hist.length ? hist.map(h => `
      <div class="item"><div class="l"><div>${niceDate(h.d)} · ${h.m}</div>
      <div>${h.ids.length} log: ${esc(h.ids.map(nameOf).join(", "))}</div></div></div>`).join("") : `<div class="empty">Abhi koi hazri nahi lagi.</div>`}
  </div>`;
}

function viewRep() {
  const t = today(), [w1, w2] = range("week"), [m1, m2] = range("month");
  const r = calc(ui.from, ui.to), s = settle(r.rows), dl = daily(ui.from, ui.to);
  const warn = r.total > 0 && r.tm === 0 ? `<div class="toast warn">Hazri nahi lagi! "Hazri" tab mein khane ki hazri lagayen, warna hisab nahi ban sakta.</div>` : "";
  const rb = (k, tx) => `<button class="small ${ui.rk === k ? "on" : ""}" data-act="rng" data-k="${k}">${tx}</button>`;
  return `
  <div class="stats">
    <div class="stat"><span>Aaj</span><b>${rs(totalExp(t, t))}</b></div>
    <div class="stat"><span>Is hafte</span><b>${rs(totalExp(w1, w2))}</b></div>
    <div class="stat"><span>Is mahine</span><b>${rs(totalExp(m1, m2))}</b></div>
  </div>
  <div class="card"><h2>Kis muddat ka hisab?</h2>
    <div class="chips">${rb("today", "Aaj")}${rb("week", "Is Hafte")}${rb("month", "Is Mahine")}${rb("last", "Pichla Mahina")}</div>
    <div class="row"><div><label>Se</label><input type="date" data-bind="from" value="${ui.from}"></div>
    <div><label>Tak</label><input type="date" data-bind="to" value="${ui.to}"></div></div>
  </div>
  ${warn}
  <div class="hero"><small>Is muddat ka total kharcha</small>
    <div class="big">${rs(r.total)}</div>
    <div class="mini"><div><span>Total khane</span>${r.tm}</div><div><span>Ek khane ka rate</span>${rs(r.rate)}</div></div>
  </div>
  <div class="card"><h2>Har banda ka hisab</h2>
    ${r.rows.length ? r.rows.map(x => `
      <div class="pc"><div class="top">${av(x.id)}<b>${esc(x.name)}</b>
        <span class="badge ${x.bal > 0.5 ? "get" : x.bal < -0.5 ? "give" : "eq"}">${x.bal > 0.5 ? "Lene " + rs(x.bal) : x.bal < -0.5 ? "Dene " + rs(-x.bal) : "Barabar"}</span></div>
        <div class="trio"><div>Lagaye<b>${rs(x.paid)}</b></div><div>Khane<b>${x.meals}</b></div><div>Hissa<b>${rs(x.share)}</b></div></div></div>`).join("") : `<div class="empty">Is muddat mein koi data nahi.</div>`}
  </div>
  <div class="card"><h2>Kis ne kis ko dena hai</h2>
    ${s.length ? s.map(x => `<div class="settle">${av(x.fid, "sm")}<b>${esc(x.from)}</b><span class="arrow">➜</span>${av(x.tid, "sm")}<b>${esc(x.to)}</b><span class="amt" style="margin-left:auto">${rs(x.amt)}</span></div>`).join("") : `<div class="empty">Koi hisab baqi nahi. 👍</div>`}
    ${r.rows.length ? `<div class="row" style="margin-top:14px;align-items:stretch">
      <button class="small" data-act="copyRep">📋 Report copy</button>
      <a class="btnlink" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(reportText())}">WhatsApp</a></div>` : ""}
  </div>
  <div class="card"><h2>Din ba din kharcha</h2>
    ${dl.length ? dl.map(([d, v]) => `<div class="item"><div class="l"><div>${niceDate(d)}</div><div>${v.meals} khane</div></div><div class="amt">${rs(v.amt)}</div></div>`).join("") : `<div class="empty">Koi kharcha nahi.</div>`}
  </div>`;
}

function viewMem() {
  const inst = deferredInstall ? `<div class="card"><h2>App install karein</h2>
    <div class="sum">Mess Manager ko phone ki app bana lein, phir net ke baghair bhi chale gi.</div>
    <button class="primary" data-act="install">📲 App Install Karo</button></div>` : "";
  return `
  ${inst}
  <div class="card"><h2>Naya member</h2>
    <div class="row" style="align-items:stretch"><input type="text" id="newName" placeholder="Naam likhein" autocomplete="off">
    <button class="blue" style="flex:0 0 90px" data-act="addMem">Add</button></div>
  </div>
  <div class="card"><h2>Saray members (${S.members.length})</h2>
    ${S.members.length ? S.members.map(m => `
      <div class="item">${av(m.id)}<div class="l"><div>${esc(m.name)}</div><div>${m.active ? "Active" : "Band" + (m.left ? " (" + niceDate(m.left) + " se)" : "")}</div>${ui.pendingMem === m.id ? `<div class="bad">${memWarn(m.id)}</div>` : ""}</div>
      <button class="small" data-act="togMem" data-id="${m.id}">${m.active ? "Band" : "Active"}</button>
      <button class="small ${ui.pendingMem === m.id ? "confirm" : "danger"}" data-act="delMem" data-id="${m.id}">${ui.pendingMem === m.id ? "Pakka?" : "🗑"}</button></div>`).join("") : `<div class="empty">Abhi koi member nahi.</div>`}
    <div class="sum" style="margin-top:10px">Jo banda mess chor jaye use "Band" kar dein: aaj se us ka khana aur hissa nahi lagay ga, purana hisab wesa hi rahega. Bilkul hata'na ho to 🗑 dabayen.</div>
  </div>
  <div class="card"><h2>Data ka backup</h2>
    <div class="sum">Data is phone mein save hota hai. Phone badalne ya browser saaf karne se pehle backup zaroor lein.</div>
    <div class="row" style="margin-top:12px">
      <button data-act="backup">⬇️ Backup lo</button>
      <button data-act="restore">⬆️ Wapis lao</button>
    </div>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
    ${storageOK ? "" : `<div class="toast warn" style="position:static">Is browser mein data save nahi ho raha. Page band karne par data chala jaye ga.</div>`}
  </div>
  <div class="foot">Mess Manager · Banane wala: <b>Sadiq Ahmad</b></div>`;
}

let toastTimer = null;
function render() {
  const app = document.getElementById("app");
  const toast = ui.msg ? `<div class="toast ${ui.warn ? "warn" : ""}">${esc(ui.msg)}</div>` : "";
  app.innerHTML = toast + { exp: viewExp, att: viewAtt, rep: viewRep, mem: viewMem }[ui.tab]();
  document.getElementById("nav").innerHTML = TABS.map(([k, tx]) =>
    `<button class="${ui.tab === k ? "on" : ""}" data-act="tab" data-k="${k}">${ICONS[k]}<span>${tx}</span></button>`).join("");
  document.getElementById("today").textContent = niceDate(today());
  clearTimeout(toastTimer);
  if (ui.msg) toastTimer = setTimeout(() => { ui.msg = ""; const t = document.querySelector(".toast"); if (t && !t.classList.contains("warn")) t.remove(); }, 3500);
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (b) ui[b] = e.target.value;
});
document.addEventListener("change", e => {
  if (e.target.id === "restoreFile") return;
  const b = e.target.dataset && e.target.dataset.bind;
  if (!b) return;
  ui[b] = e.target.value;
  if (b === "attDate") { if (!ui.attDate) ui.attDate = today(); loadAtt(); render(); }
  if (b === "from" || b === "to") { ui.rk = ""; render(); }
});

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) { }
  try {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id);
  ui.msg = ""; ui.warn = false;
  if (act !== "delExp") ui.pendingDel = null;
  if (act !== "delMem") ui.pendingMem = null;
  const fail = m => { ui.msg = m; ui.warn = true; };

  if (act === "tab") { ui.tab = el.dataset.k; if (ui.tab === "att") loadAtt(); window.scrollTo(0, 0); }

  else if (act === "addMem") {
    const n = document.getElementById("newName").value.trim();
    if (!n) return;
    if (S.members.some(m => m.name.toLowerCase() === n.toLowerCase())) fail(`"${n}" pehle se mojood hai.`);
    else { S.members.push({ id: S.nid++, name: n, active: true }); save(); loadAtt(); ui.msg = `${n} add ho gaya.`; }
  }
  else if (act === "togMem") {
    const m = S.members.find(m => m.id === id);
    if (m) {
      if (m.active) {
        m.active = false; m.left = today();
        Object.keys(S.att).forEach(k => { if (k.split("|")[0] >= m.left) S.att[k] = S.att[k].filter(i => i !== m.id); });
        ui.msg = `${m.name} band ho gaya. Aaj se is ka khana aur hissa nahi lagay ga.`;
      } else { m.active = true; delete m.left; ui.msg = `${m.name} dobara active ho gaya.`; }
      save(); loadAtt();
    }
  }
  else if (act === "delMem") {
    if (ui.pendingMem === id) {
      const nm = nameOf(id);
      S.members = S.members.filter(m => m.id !== id);
      S.expenses = S.expenses.filter(x => x.mid !== id);
      Object.keys(S.att).forEach(k => { S.att[k] = S.att[k].filter(i => i !== id); });
      save(); ui.pendingMem = null; loadAtt(); ui.msg = `${nm} delete ho gaya.`;
    } else ui.pendingMem = id;
  }

  else if (act === "qi") { ui.item = el.dataset.v === "Doosra" ? "" : el.dataset.v; }
  else if (act === "addExp") {
    const amt = parseFloat(ui.amount);
    if (!ui.expDate) fail("Tareekh chunein.");
    else if (!ui.payer) fail("Kis ne sauda lia, wo chunein.");
    else if (!(amt > 0)) fail("Paisa sahi likhein.");
    else {
      S.expenses.push({ id: S.nid++, date: ui.expDate, mid: Number(ui.payer), item: ui.item.trim(), amount: amt });
      save(); ui.item = ""; ui.amount = ""; ui.msg = `✅ Save ho gaya: ${rs(amt)}`;
    }
  }
  else if (act === "delExp") {
    if (ui.pendingDel === id) { S.expenses = S.expenses.filter(x => x.id !== id); save(); ui.pendingDel = null; ui.msg = "Delete ho gaya."; }
    else ui.pendingDel = id;
  }

  else if (act === "prevDay" || act === "nextDay") { ui.attDate = addDays(ui.attDate, act === "prevDay" ? -1 : 1); loadAtt(); }
  else if (act === "meal") { ui.meal = el.dataset.m; loadAtt(); }
  else if (act === "tog") { ui.checked.has(id) ? ui.checked.delete(id) : ui.checked.add(id); }
  else if (act === "allOn") ui.checked = new Set(activeMembers().map(m => m.id));
  else if (act === "allOff") ui.checked = new Set();
  else if (act === "saveAtt") {
    const key = ui.attDate + "|" + ui.meal;
    const keep = (S.att[key] || []).filter(i => { const m = S.members.find(x => x.id === i); return m && !m.active && m.left && ui.attDate < m.left; });
    S.att[key] = [...new Set([...ui.checked, ...keep])]; save(); ui.attSaved = true;
    ui.msg = `✅ Save ho gaya: ${niceDate(ui.attDate)} ${ui.meal} - ${ui.checked.size} log.`;
  }

  else if (act === "rng") { ui.rk = el.dataset.k; [ui.from, ui.to] = range(ui.rk); }
  else if (act === "copyRep") { const ok = await copyText(reportText()); ui.msg = ok ? "Report copy ho gayi." : "Copy nahi ho saki."; ui.warn = !ok; }

  else if (act === "install") {
    if (deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { } deferredInstall = null; }
  }
  else if (act === "backup") {
    try {
      const bl = new Blob([JSON.stringify(S)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(bl); a.download = `mess-backup-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      ui.msg = "Backup file download ho gayi.";
    } catch (err) { fail("Backup nahi ho saka."); }
  }
  else if (act === "restore") { document.getElementById("restoreFile").click(); return; }

  render();
});

document.addEventListener("change", e => {
  if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.members) || !Array.isArray(d.expenses) || typeof d.att !== "object") throw 0;
      S = { members: d.members, expenses: d.expenses, att: d.att, nid: d.nid || 1000000 };
      migrate(); save(); loadAtt(); ui.msg = "Backup wapis aa gaya."; ui.warn = false;
    } catch (err) { ui.msg = "Yeh sahi backup file nahi hai."; ui.warn = true; }
    render();
  };
  rd.readAsText(e.target.files[0]);
});

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (ui.tab === "mem") render(); });
window.addEventListener("appinstalled", () => { deferredInstall = null; });

if (!storageOK) { ui.msg = "Is browser mein data save nahi ho sakta (private mode?)."; ui.warn = true; }
render();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => { }); }
</script>
</body>
</html>
